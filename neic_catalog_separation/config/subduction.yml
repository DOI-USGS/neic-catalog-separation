# Degree of membership parameters

# Maximum distance from slab to consider as outer rise
outerrise_maxdist: 600.0

# Max depth of slab at closest point to detect outer rise region
outerrise_slab_maxdepth: 100.0

# If using the --int-cutoff flag, use this value for the interface cutoff depth (km)
int_cutoff: 62.0

p_outerrise_slab:
  p1: 1.0
  p2: 0.0

# Calculate interface degree of membership given Kagan's angle
p_interface_kagan:
  x1: 30.0
  p1: 1.0
  x2: 53.0
  p2: 0.25

# Calculate interface degree of membership given depth relative to slab interface
p_interface_slab:
  p1: 0.0
  p2: 1.0

# Calculate interface degree of membership given depth below seismogenic zone
p_interface_sz:
  p1: 1.0
  p2: 0.0

# Calculate interface degree of membership given depth within flex zone part 2
p_interface_fx:
  p1: 0.0
  p2: 0.4

# Calculate crustal degree of membership given depth relative to slab depth
p_crustal_slab:
  x1: -20.0
  p1: 1.0
  x2: 20.0
  p2: 0.0

# Calculate crustal degree of membership given depth relative to Moho depth and slab depth
p_crustal_moho_slab:
  p1: 1.0
  p2: 0.0

# Calculate crustal degree of membership given depth relative to moho depth
p_crustal_moho:
  p1: 1.0
  p2: 0.0

# Calculate outer-rise degree of membership given depth relative to moho depth
p_outerrise_moho:
  p1: 1.0
  p2: 0.0

# Calculate intraslab degree of membership given depth relative to top of slab
p_intraslab_interface:
  p1: 0.0
  p2: 1.0

# Calculate intraslab degree of membership given depth relative to bottom of slab
p_intraslab_slab:
  p1: 1.0
  p2: 0.0

# To re-name/re-map any categories, uncomment the renaming dictionary below. This can be edited as desired.
# rename:
#   crustal_mantle: EqType.CRUSTAL
#   mantle: EqType.UNKNOWN
#   subduction_interface_mantle: EqType.SUBDUCTION_INTERFACE
#   subduction_intraslab_mantle: EqType.SUBDUCTION_INTRASLAB
#   subduction_outerrise_mantle: EqType.SUBDUCTION_OUTERRISE
