# Degree of membership parameters
include_uncertainty: True

# Crustal membership parameters.
# x1: Depth above Moho (negative) where membership is 1.0.
# x2: Depth below Moho (positive) where membership is 0.0.
p_crustal:
  x1: 0.0
  x2: 20.0

# Interface membership parameters.
# Local uncertainty is included if include_uncertainty is True.

# Calculate interface degree of membership given Kagan's angle
p_interface_kagan:
  x1: 30.0
  p1: 1.0
  x2: 53.0
  p2: 0.25

# x1: Depth above slab interface (negative) where membership is 0.0.
# x2: Depth below slab interface (positive) where membership is 1.0.
p_interface_shallow:
  x1: -20.0
  x2: 0.0

# x1: Depth above slab interface (negative) where membership is 1.0.
# x2: Depth below slab interface (positive) where membership is 0.0.
p_interface_deep:
  x1: 0.0
  x2: 30.0

# x1: Depth above slab interface (negative) where membership is 1.0.
# x2: Depth below slab interface (positive) where membership is 0.0.
p_interface_seismogenic:
  x1: 0.0
  x2: 20.0

# Intraslab membership parameters.
# Local uncertainty is included if include_uncertainty is True.

# x1: Depth above top of slab (negative) where membership is 0.0.
# x2: Depth below top of slab (positive) where membership is 1.0.
p_intraslab_shallow:
  x1: 0.0
  x2: 0.0

# x1: Depth above bottom of slab (negative) where membership is 1.0.
# x2: Depth below bottom of slab (positive) where membership is 0.0.
p_intraslab_deep:
  x1: 0.0
  x2: +50.0

# Outer rise membership parameters.

# Maximum distance from slab to consider as outer rise
outerrise_maxdist: 600.0

# Max depth of slab at closest point to detect outer rise region
outerrise_slab_maxdepth: 50.0

# x1: Depth above bottom of slab (negative) where membership is 1.0.
# x2: Depth below bottom of slab (positive) where membership is 0.0.
p_outerrise:
  x1: 0.0
  x2: 20.0

# Obsolete

# Calculate interface degree of membership given depth relative to slab interface
p_interface_slab:
  p1: 0.0
  p2: 1.0

# Calculate interface degree of membership given depth below seismogenic zone
p_interface_sz:
  p1: 1.0
  p2: 0.0

# Calculate interface degree of membership given depth within flex zone part 2
p_interface_fx:
  p1: 0.0
  p2: 0.4

# Calculate crustal degree of membership given depth relative to slab depth
p_crustal_slab:
  p1: 1.0
  p2: 0.0

# Calculate crustal degree of membership given depth relative to Moho depth and slab depth
p_crustal_moho_slab:
  p1: 1.0
  p2: 0.0

# Calculate crustal degree of membership given depth relative to moho depth
p_crustal_moho:
  p1: 1.0
  p2: 0.0

# Calculate outer-rise degree of membership given depth relative to moho depth
p_outerrise_moho:
  p1: 1.0
  p2: 0.0

# Calculate intraslab degree of membership given depth relative to top of slab
p_intraslab_interface:
  p1: 0.0
  p2: 1.0

# Calculate intraslab degree of membership given depth relative to bottom of slab
p_intraslab_slab:
  p1: 1.0
  p2: 0.0

